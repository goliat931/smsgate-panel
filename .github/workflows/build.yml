name: build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: grep -q "\"${GITHUB_REF_NAME#v}\"" sms_panel/__init__.py || { echo "Tag $GITHUB_REF_NAME nie zgadza sie z __version__"; exit 1; }
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - if: runner.os == 'Windows'
        run: ./build.ps1
        shell: pwsh
      - if: runner.os != 'Windows'
        run: sh build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: SmsPanel-${{ runner.os }}
          path: dist/

  release:
    # wydanie na GitHubie: z niego panel sprawdza aktualizacje, a README linkuje do pobrania
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes \
            SmsPanel-Windows/SmsPanel.exe SmsPanel-Windows/Tryb-demo.bat SmsPanel-Windows/INSTRUKCJA.md SmsPanel-macOS/SmsPanel
